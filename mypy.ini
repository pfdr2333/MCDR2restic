# mypy 静态类型检查配置：拦截单测 mock 边界处不可见的签名漂移、None 误用等
# （2026-11 v0.7.0 事故：start_restic_process 签名 5→4 参后调用点未同步，351 个
# 单测全 mock 在进程启动边界，CI 未能拦截；静态检查可直接报出参数数量错误）
[mypy]
python_version = 3.10
# 未注解函数也检查函数体，覆盖历史代码
check_untyped_defs = true
# 忽略项失效即报错，防止 ignore 堆积掩盖真实回归
warn_unused_ignores = true
warn_redundant_casts = true

[mypy-mcdreforged.*]
# 运行时由 tests/support.py 注入 stub，环境中无真实包
ignore_missing_imports = true

[mypy-yaml.*]
ignore_missing_imports = true

[mypy-websocket.*]
ignore_missing_imports = true

[mypy-opencc, mypy-opencc.*]
; opencc-python-reimplemented 未附带 py.typed
ignore_missing_imports = true
