config_template: |-
  # MCDR2Restic 配置檔案
  # state.yml 為執行時狀態檔案，請勿更改
  
  # 總開關。
  enabled: true
  
  # 外掛語言。預設會寫入生成配置時 MCDR 傳入的語言。
  # 可填寫已有語言檔名，如 zh_cn、zh_tw、en_us；未匹配時回退 en_us。
  language: __MCDR2RESTIC_LANGUAGE__
  
  command:
    # MCDR 命令根節點
    root: "!!restic"
    # 別名
    aliases:
      - "!!m2r"
    # MCDR 許可權等級
    permission_level: 3
  
  schedule:
    # interval_seconds > 0 時用固定間隔；為 0 時用下面的 6 位 cron。
    interval_seconds: 0
    # 6 位 cron：秒 分 時 日 月 周。預設每 3 小時一次。
    cron_expression: "0 0 0,3,6,9,12,15,18,21 * * *"
    # 是否只在玩家活動過的週期才備份：結合週期內的加入/退出事件與觸發時的線上人數判斷，無人活動則跳過。
    require_player_activity_in_wait_period: true
    # 查詢線上人數的 Minecraft 命令，透過 RCON 執行；RCON 不可用時只依賴加入/退出事件。
    online_check_command: "list"
  
  force_schedule:
    # 強制備份排程，不看玩家活動，預設關閉。
    # interval_seconds > 0 時用固定間隔；為 0 且 cron_expression = "0" 時關閉。
    interval_seconds: 0
    cron_expression: "0"
  
  maintenance_schedule:
    # 倉庫維護排程，預設每天 03:00 執行一次。
    # interval_seconds > 0 時用固定間隔；為 0 且 cron_expression = "0" 時關閉。
    interval_seconds: 0
    cron_expression: "0 0 3 * * *"
  
  update_check:
    # 版本更新檢查。啟用後外掛載入時檢查一次，並在每天 00:00 檢查一次。
    enabled: true
    check_on_startup: true
    daily_time: "00:00"
    # GitHub latest release API。網路不佳時會按 proxy_prefixes 嘗試代理。
    api_url: "https://api.github.com/repos/pfdr2333/MCDR2restic/releases/latest"
    release_page_url: "https://github.com/pfdr2333/MCDR2restic/releases/latest"
    proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    timeout_seconds: 10
  
  minecraft:
  __MCDR2RESTIC_MINECRAFT_SAVE_ALL_COMMENT__
    save_off_command: "save-off"
    save_all_command: "save-all flush"
    save_on_command: "save-on"
    wait_after_save_off_seconds: 2
    # 備份前等待 save-all 完成的最長時限（秒）；檢測到完成提示會提前繼續。
    wait_after_save_all_seconds: 10
    # 是否透過服務端輸出確認 save-all 完成；關閉則固定等待上面的時限。
    wait_for_save_all_completion: true
    # 判定 save-all 完成的輸出關鍵詞，可按服務端實際日誌調整。
    save_all_done_patterns:
      - "Saved the game"
      - "Saved the world"
    wait_after_save_on_seconds: 1
  
  restic:
    # 所有 restic 命令都以 executable 開頭執行，預設是配置目錄下的 restic。
    executable: __MCDR2RESTIC_EXECUTABLE__
    # restic 程序工作目錄，留空表示繼承 MCDR 當前目錄。
    working_directory: ""
    # restic 儲存庫，預設是 MCDR 工作目錄下的本地倉庫。
    repository: __MCDR2RESTIC_REPOSITORY__
    # 儲存庫密碼，留空時使用 password_file。示例密碼僅用於上手測試，正式使用請改強密碼。
    password: "123456"
    # 密碼檔案，僅在 password 為空時使用。
    password_file: ""
    # 找不到 restic 時自動下載，僅支援 Linux/Windows amd64。
    auto_download: true
    # 下載版本：預設使用外掛內建信任的版本；latest 表示跟隨官方最新版。
    download_version: "v0.19.1"
    # 下載代理字首，先官方 GitHub，再按順序嘗試。
    download_proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    download_timeout_seconds: 120
    # 本地倉庫缺失時自動執行 restic init；遠端倉庫不初始化。
    auto_init_local_repository: true
    # 執行 restic 時疊加的環境變數，值為 null 表示刪除繼承的同名變數。
    # repository/password/password_file 會自動寫入對應 RESTIC_* 變數。
    environment: {}
    # 倉庫維護命令，由 maintenance_schedule 排程執行，自動加 executable。
    maintenance_commands:
      - [
          "forget",
          "--keep-within", "1d",
          "--keep-daily", "7",
          "--prune"
        ]
    # 備份命令，自動加 executable。預設只備份世界，建議改為整個 ./server 目錄或 MCDR 根目錄，保護存檔之外的檔案。
  __MCDR2RESTIC_DEFAULT_BACKUP_COMMENT__
    backup_command:
      - "backup"
      __MCDR2RESTIC_DEFAULT_BACKUP_SOURCES__
      - "--tag"
      - "minecraft"
      - "--host"
      - "mcdr2Restic"
    # restic 命令流程總超時，0 表示不限制。
    timeout_seconds: 0
    # backup/restore --json 進度回顯間隔（秒）。
    progress_interval_seconds: 5
    # 視為成功的退出碼。
    success_exit_codes:
      - 0
    # 輸出命中這些規則時按失敗處理。
    error_regexes:
      - '(?i)^fatal:'
      - '(?i)^error(?:s)?\b(?!:\s*0\b)'
      - '(?i)\b(permission denied|input/output error|read error|unreadable|failed to|unable to)\b'
      - '(?i)\bno such file or directory\b'
    ignore_error_regexes:
      - '(?i)errors?:\s*0\b'
      - '(?i)no errors? (?:were )?found'
    max_output_chars_in_notification: 1800
  
  onebot:
    # OneBot v11 通知。填好 admin_qqs 後把 enabled 改為 true。
    enabled: false
    # WebSocket 地址
    ws_url: "ws://127.0.0.1:8777"
    # 連線驗證令牌
    access_token: ""
    # true 時令牌放在 Authorization 頭，false 時放在 URL 引數（NapCat 常用）。
    use_header_auth: false
    # 需要通知的 QQ
    admin_qqs:
      - 123456789
    # 訊息字首
    message_prefix: "[MCDR2Restic]"
    # 連線與傳送超時、重連間隔（秒）
    connect_timeout_seconds: 10
    send_timeout_seconds: 10
    reconnect_interval_seconds: 5
  
  discord:
    # Discord Webhook 通知。填好 webhook_url 後把 enabled 改為 true。
    enabled: false
    # Discord 頻道 Webhook URL
    webhook_url: ""
    # Webhook 顯示名稱和頭像，可留空使用預設值。
    username: "MCDR2Restic"
    avatar_url: ""
    # 通知訊息字首
    message_prefix: "[MCDR2Restic]"
    # 可選提及物件，預設不提及任何人。
    mention_user_ids: []
    mention_role_ids: []
    mention_everyone: false
    send_timeout_seconds: 10
  
  custom_webhook:
    # 通用自定義 Webhook。填好 url 後把 enabled 改為 true。
    enabled: false
    # 接收 POST 請求的 URL。
    url: ""
    # 通知訊息字首。
    message_prefix: "[MCDR2Restic]"
    # 請求超時秒數。
    send_timeout_seconds: 10
    # 附加請求頭，例如 Authorization。
    headers: {}
    # JSON 請求體模板，值中的 {message} 是通知正文，也可用 {label} {status} 等變數。
    payload:
      content: "{message}"
  
  notification:
    # 備份通知策略，對 OneBot、Discord 與自定義 Webhook 生效。
    notify_on_start: true # 備份開始時通知
    notify_on_success: true # 備份成功時通知
    notify_on_failure: true # 備份失敗時通知
    notify_on_skip: false # 備份被跳過時通知
  
  snapshot_cache:
    # status 命令的快照列表快取。
    enabled: true
    # 每頁快照數量
    page_size: 10
    # 重新整理快取時 restic snapshots 的超時（秒）
    query_timeout_seconds: 30
    # 快取資料庫檔名，位於外掛配置目錄
    database: "snapshots.sqlite3"
  
  restore:
    # 恢復前自動建立的保護快照使用的 tag。
    pre_restore_backup_tag: "mcdr2restic-pre-restore"
    # 恢復流程中停止/啟動 Minecraft 的超時（秒）。
    start_timeout_seconds: 120
  
  messages:
    # 管理員通知訊息模板，可自行修改文字。
    # 可用變數：{prefix} {label} {start_time} {end_time} {duration_seconds} {status} {message} {detail} {error}
    # 如果需要輸出字面量花括號，請寫成 {{ 或 }}。
    backup_start: |-
      __MCDR2RESTIC_MESSAGE_backup_start__
    backup_success: |-
      __MCDR2RESTIC_MESSAGE_backup_success__
    backup_failure: |-
      __MCDR2RESTIC_MESSAGE_backup_failure__
    backup_skip_no_player: |-
      __MCDR2RESTIC_MESSAGE_backup_skip_no_player__
    backup_not_ready: |-
      __MCDR2RESTIC_MESSAGE_backup_not_ready__
    schedule_config_error: |-
      __MCDR2RESTIC_MESSAGE_schedule_config_error__
  
  __MCDR2RESTIC_CONFIG_VERSION_MARKER_COMMENT__
  config_version: 10

texts:
  "template.message.backup_failure": |-
    {prefix} 備份異常
    觸發: {label}
    狀態: {status}
    詳情: {detail}
    結束時間: {end_time}
  "template.message.backup_not_ready": |-
    {prefix} 備份已跳過
    {message}
  "template.message.backup_skip_no_player": |-
    {prefix} 跳過備份
    本週期沒有玩家加入或退出，觸發檢查時也沒有玩家線上
  "template.message.backup_start": |-
    {prefix} 備份開始
    觸發: {label}
    時間: {start_time}
  "template.message.backup_success": |-
    {prefix} 備份成功
    觸發: {label}
    耗時: {duration_seconds} 秒
    結束時間: {end_time}
  "template.message.schedule_config_error": |-
    {prefix} 排程配置錯誤
    計算下次備份時間失敗：{error}
  "template.snippet.config_version_marker_comment": |-
    # 配置檔案版本標識。請保留在檔案尾部，方便後續遷移。
  "template.snippet.default_backup_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # 新生成配置預設只寫入 ./server/world；如果生成配置時檢測到三世界目錄全部存在，會自動加入 world_nether 和 world_the_end。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # 新生成配置預設只寫入 .\server\world；如果生成配置時檢測到三世界目錄全部存在，會自動加入 world_nether 和 world_the_end。
  "template.snippet.minecraft_save_all_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # Linux Java 版示例。若服務端不支援 save-all flush，可改為 save-all。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # Windows Java 版示例。若服務端不支援 save-all flush，可改為 save-all。
  "template.snippet.restic_executable": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./config/mcdr2restic/restic"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\config\mcdr2restic\restic.exe'
  "template.snippet.restic_repository": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./restic-repo"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\restic-repo'
  "template.snippet.session_lock_exclude_comment": |-
    # Windows 下 Minecraft 會鎖定 session.lock，預設排除以避免 restic 返回 3。
