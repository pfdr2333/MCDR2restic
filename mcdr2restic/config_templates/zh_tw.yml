config_template: |-
  # MCDR2Restic 配置檔案
  # state.yml為執行時狀態檔案，請勿更改
  
  # 總開關。
  enabled: true
  
  # 外掛語言。預設會寫入生成配置時 MCDR 傳入的語言。
  # 可填寫已有語言檔名，如 zh_cn、zh_tw、en_us；未匹配時回退 en_us。
  language: __MCDR2RESTIC_LANGUAGE__
  
  command:
    # MCDR 命令根節點
    root: "!!restic"
    #別名
    aliases:
      - "!!m2r"
    # MCDR 許可權等級。
    permission_level: 3
  
  schedule:
    # interval_seconds > 0 時使用固定間隔。
    # interval_seconds = 0 時使用下面的 6 位 cron_expression。
    interval_seconds: 0
    # 6 位 cron：秒 分 時 日 月 周。預設每 3 小時檢查一次正常備份。
    cron_expression: "0 0 0,3,6,9,12,15,18,21 * * *"
    # 正常定時備份是否啟用玩家活動感知。
    # 觸發時會執行一次 list 檢查當前線上人數；join/left 事件會記錄本週期是否有人進入或退出。
    # 判斷流程：
    # - 本週期有人加入：備份
    # - 無人加入，list 檢查線上人數為 0：跳過
    # - 無人加入，list 檢查線上人數不為 0：備份
    # - 無人加入，但有人退出，即使 list 檢查為 0：備份
    require_player_activity_in_wait_period: true
    # 用於查詢當前線上人數的 Minecraft 命令。預設 list。
    # 透過 server.rcon_query 執行；如果 RCON 不可用，將只依賴 join/left 事件估算。
    online_check_command: "list"
  
  force_schedule:
    # 強制備份排程，不遵循玩家活動感知。預設關閉。
    # interval_seconds > 0 時使用固定間隔。
    # interval_seconds = 0 且 cron_expression 不是 "0" 時使用 6 位 cron。
    # interval_seconds = 0 且 cron_expression = "0" 表示關閉強制備份。
    interval_seconds: 0
    cron_expression: "0"
  
  maintenance_schedule:
    # 倉庫維護排程。預設每天 03:00 執行一次；cron_expression 留空時仍使用預設值。
    # interval_seconds > 0 時使用固定間隔。
    # interval_seconds = 0 且 cron_expression = "0" 表示關閉維護排程。
    interval_seconds: 0
    cron_expression: "0 0 3 * * *"
  
  update_check:
    # 版本更新檢查。啟用後外掛載入時檢查一次，並在每天 00:00 檢查一次。
    enabled: true
    check_on_startup: true
    daily_time: "00:00"
    # GitHub latest release API。網路不佳時會按 proxy_prefixes 嘗試代理。
    api_url: "https://api.github.com/repos/pfdr2333/MCDR2restic/releases/latest"
    release_page_url: "https://github.com/pfdr2333/MCDR2restic/releases/latest"
    proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    timeout_seconds: 10
  
  minecraft:
  __MCDR2RESTIC_MINECRAFT_SAVE_ALL_COMMENT__
    save_off_command: "save-off"
    save_all_command: "save-all flush"
    save_on_command: "save-on"
    wait_after_save_off_seconds: 2
    wait_after_save_all_seconds: 10
    wait_after_save_on_seconds: 1
  
  restic:
    # 所有命令都以 executable 開頭執行。
    # 預設表示 MCDR 配置資料夾下的 restic 可執行檔案。
    executable: __MCDR2RESTIC_EXECUTABLE__
    # restic 程序工作目錄。
    # 留空字串或 null 表示繼承 MCDR 當前工作目錄。
    working_directory: ""
    # restic 儲存庫。預設使用 MCDR 工作目錄下的本地倉庫。
    repository: __MCDR2RESTIC_REPOSITORY__
    # 儲存庫密碼。優先使用這裡的直接密碼；留空字串時再看 password_file。
    # 示例密碼方便開箱測試，正式使用請改成自己的強密碼。
    password: "123456"
    # 密碼檔案。僅當 password 為空時生效。
    password_file: ""
    # 如果仍使用預設 executable 路徑且找不到 restic，則自動下載 restic。
    # 僅支援 Linux amd64 和 Windows amd64；其他系統會跳過。
    auto_download: true
    # restic 下載版本。latest 表示 GitHub 最新 release，也可以寫 v0.18.0 這類版本號。
    download_version: "latest"
    # 下載加速代理字首。會先嚐試官方 GitHub 下載，再按順序嘗試這裡的代理。
    download_proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    download_timeout_seconds: 120
    # 本地儲存庫不存在或缺少 config 時自動執行 restic init。
    # S3/B2/rest/sftp/rclone 等遠端倉庫不會自動初始化。
    auto_init_local_repository: true
    # 執行 restic 時會繼承 MCDR 程序環境，併疊加這裡的變數。
    # 值為 null 表示刪除繼承來的同名變數。
    # repository/password/password_file 會自動寫入 RESTIC_REPOSITORY/RESTIC_PASSWORD/RESTIC_PASSWORD_FILE。
    # S3/B2 等後端可以在這裡加入對應雲服務環境變數。
    environment: {}
    # 倉庫維護命令，由 maintenance_schedule 單獨排程執行。每一項都會自動在前面加 executable，例如 restic forget ...
    maintenance_commands:
      - [
          "forget",
          "--keep-within", "1d",
          "--keep-daily", "7",
          "--prune"
        ]
    # 備份命令。同樣會自動在前面加 executable，例如 restic backup ...
  __MCDR2RESTIC_DEFAULT_BACKUP_COMMENT__
    backup_command:
      - "backup"
      __MCDR2RESTIC_DEFAULT_BACKUP_SOURCES__
      - "--tag"
      - "minecraft"
      - "--host"
      - "mcdr2Restic"
    # 整個 restic 命令流程共用的超時。0 表示不限制。
    timeout_seconds: 0
    # restic backup/restore --json 進度回顯間隔，單位秒。
    progress_interval_seconds: 5
    # restic 退出碼。0 成功；3 表示有原始檔不可讀，本外掛預設按失敗處理。
    success_exit_codes:
      - 0
    # 即使退出碼為 0，只要輸出匹配這些規則，也按異常處理。
    error_regexes:
      - '(?i)^fatal:'
      - '(?i)^error(?:s)?\b(?!:\s*0\b)'
      - '(?i)\b(permission denied|input/output error|read error|unreadable|failed to|unable to)\b'
      - '(?i)\bno such file or directory\b'
    ignore_error_regexes:
      - '(?i)errors?:\s*0\b'
      - '(?i)no errors? (?:were )?found'
    max_output_chars_in_notification: 1800
  
  onebot:
    # OneBot V11 正向 WebSocket。填好 admin_qqs 後把 enabled 改為 true。
    enabled: false
    # WebSocket 伺服器地址
    ws_url: "ws://127.0.0.1:8777"
    # 用於連線驗證的令牌
    access_token: ""
    # true 使用 Header: Authorization: Bearer xxx；false 使用 URL 引數 access_token，NapCat 常用。
    use_header_auth: false
    #需要通知的QQ
    admin_qqs:
      - 123456789
    #訊息字首
    message_prefix: "[MCDR2Restic]"
    # 網路超時與重連策略
    connect_timeout_seconds: 10
    send_timeout_seconds: 10
    reconnect_interval_seconds: 5
  
  discord:
    # Discord Webhook 通知。填好 webhook_url 後把 enabled 改為 true。
    enabled: false
    # Discord 頻道 Webhook URL。
    webhook_url: ""
    # Webhook 顯示名稱和頭像，可留空使用 Discord Webhook 預設值。
    username: "MCDR2Restic"
    avatar_url: ""
    # Discord 通知訊息字首，訊息正文仍使用 messages 中的模板。
    message_prefix: "[MCDR2Restic]"
    # 可選提及物件。預設不提及任何人，避免誤 ping。
    mention_user_ids: []
    mention_role_ids: []
    mention_everyone: false
    send_timeout_seconds: 10
  
  notification:
    # 備份生命週期通知策略
    # 控制在哪些備份階段向上述管理員推送 QQ 訊息
    notify_on_start: true # 備份任務開始時是否傳送通知
    notify_on_success: true # 備份任務成功完成時是否傳送通知
    notify_on_failure: true # 備份任務失敗時是否傳送通知
    notify_on_skip: false # 備份任務被跳過（如無需備份）時是否傳送通知
  
  snapshot_cache:
    # status 命令中的 restic 快照列表快取。
    # 快取寫入 SQLite 檔案，只有倉庫被本外掛操作後才會標記失效。
    enabled: true
    # 每頁顯示的快照數量。預設 10。
    page_size: 10
    # 快取重新整理時執行 restic snapshots --json 的超時時間。
    query_timeout_seconds: 30
    # SQLite 快取檔名，位於本外掛配置目錄。
    database: "snapshots.sqlite3"
  
  restore:
    # 執行恢復前會自動備份一次，並給該保護快照追加這個 tag。
    pre_restore_backup_tag: "mcdr2restic-pre-restore"
    # 恢復流程透過 MCDR 服務端停止/啟動 hook 接力，這兩個值保留給狀態機/外部看門狗使用。
    stop_timeout_seconds: 120
    start_timeout_seconds: 120
  
  messages:
    # 管理員通知訊息模板，可自行修改文字。
    # 可用變數：{prefix} {label} {start_time} {end_time} {duration_seconds} {status} {message} {detail} {error}
    # 如果需要輸出字面量花括號，請寫成 {{ 或 }}。
    backup_start: |-
      __MCDR2RESTIC_MESSAGE_backup_start__
    backup_success: |-
      __MCDR2RESTIC_MESSAGE_backup_success__
    backup_failure: |-
      __MCDR2RESTIC_MESSAGE_backup_failure__
    backup_skip_no_player: |-
      __MCDR2RESTIC_MESSAGE_backup_skip_no_player__
    backup_not_ready: |-
      __MCDR2RESTIC_MESSAGE_backup_not_ready__
    schedule_config_error: |-
      __MCDR2RESTIC_MESSAGE_schedule_config_error__
  
  __MCDR2RESTIC_CONFIG_VERSION_MARKER_COMMENT__
  config_version: 10

texts:
  "template.message.backup_failure": |-
    {prefix} 備份異常
    觸發: {label}
    狀態: {status}
    詳情: {detail}
    結束時間: {end_time}
  "template.message.backup_not_ready": |-
    {prefix} 備份異常
    到達備份時間，但 Minecraft 服務端尚未確認正常執行，跳過本次備份
  "template.message.backup_skip_no_player": |-
    {prefix} 跳過備份
    本週期沒有玩家加入或退出，觸發檢查時也沒有玩家線上
  "template.message.backup_start": |-
    {prefix} 備份開始
    觸發: {label}
    時間: {start_time}
  "template.message.backup_success": |-
    {prefix} 備份成功
    觸發: {label}
    耗時: {duration_seconds} 秒
    結束時間: {end_time}
  "template.message.schedule_config_error": |-
    {prefix} 排程配置錯誤
    計算下次備份時間失敗：{error}
  "template.snippet.config_version_marker_comment": |-
    # 配置檔案版本標識。請保留在檔案尾部，方便後續遷移。
  "template.snippet.default_backup_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # 新生成配置預設只寫入 ./server/world；如果生成配置時檢測到三世界目錄全部存在，會自動加入 world_nether 和 world_the_end。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # 新生成配置預設只寫入 .\server\world；如果生成配置時檢測到三世界目錄全部存在，會自動加入 world_nether 和 world_the_end。
  "template.snippet.minecraft_save_all_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # Linux Java 版示例。若服務端不支援 save-all flush，可改為 save-all。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # Windows Java 版示例。若服務端不支援 save-all flush，可改為 save-all。
  "template.snippet.restic_executable": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./config/mcdr2restic/restic"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\config\mcdr2restic\restic.exe'
  "template.snippet.restic_repository": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./restic-repo"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\restic-repo'
  "template.snippet.session_lock_exclude_comment": |-
    # Windows 下 Minecraft 會鎖定 session.lock，預設排除以避免 restic 返回 3。
