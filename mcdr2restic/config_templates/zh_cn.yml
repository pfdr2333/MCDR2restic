config_template: |-
  # MCDR2Restic 配置文件
  # state.yml 为运行时状态文件，请勿更改
  
  # 总开关。
  enabled: true
  
  # 插件语言。默认会写入生成配置时 MCDR 传入的语言。
  # 可填写已有语言文件名，如 zh_cn、zh_tw、en_us；未匹配时回退 en_us。
  language: __MCDR2RESTIC_LANGUAGE__
  
  command:
    # MCDR 命令根节点
    root: "!!restic"
    # 别名
    aliases:
      - "!!m2r"
    # MCDR 权限等级
    permission_level: 3
  
  schedule:
    # interval_seconds > 0 时用固定间隔；为 0 时用下面的 6 位 cron。
    interval_seconds: 0
    # 6 位 cron：秒 分 时 日 月 周。默认每 3 小时一次。
    cron_expression: "0 0 0,3,6,9,12,15,18,21 * * *"
    # 是否只在玩家活动过的周期才备份：结合周期内的加入/退出事件与触发时的在线人数判断，无人活动则跳过。
    require_player_activity_in_wait_period: true
    # 查询在线人数的 Minecraft 命令，通过 RCON 执行；RCON 不可用时只依赖加入/退出事件。
    online_check_command: "list"
  
  force_schedule:
    # 强制备份调度，不看玩家活动，默认关闭。
    # interval_seconds > 0 时用固定间隔；为 0 且 cron_expression = "0" 时关闭。
    interval_seconds: 0
    cron_expression: "0"
  
  maintenance_schedule:
    # 仓库维护调度，默认每天 03:00 执行一次。
    # interval_seconds > 0 时用固定间隔；为 0 且 cron_expression = "0" 时关闭。
    interval_seconds: 0
    cron_expression: "0 0 3 * * *"
  
  update_check:
    # 版本更新检查。启用后插件加载时检查一次，并在每天 00:00 检查一次。
    enabled: true
    check_on_startup: true
    daily_time: "00:00"
    # GitHub latest release API。网络不佳时会按 proxy_prefixes 尝试代理。
    api_url: "https://api.github.com/repos/pfdr2333/MCDR2restic/releases/latest"
    release_page_url: "https://github.com/pfdr2333/MCDR2restic/releases/latest"
    proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    timeout_seconds: 10
  
  minecraft:
  __MCDR2RESTIC_MINECRAFT_SAVE_ALL_COMMENT__
    save_off_command: "save-off"
    save_all_command: "save-all flush"
    save_on_command: "save-on"
    wait_after_save_off_seconds: 2
    # 备份前等待 save-all 完成的最长时限（秒）；检测到完成提示会提前继续。
    wait_after_save_all_seconds: 10
    # 是否通过服务端输出确认 save-all 完成；关闭则固定等待上面的时限。
    wait_for_save_all_completion: true
    # 判定 save-all 完成的输出关键词，可按服务端实际日志调整。
    save_all_done_patterns:
      - "Saved the game"
      - "Saved the world"
    wait_after_save_on_seconds: 1
  
  restic:
    # 所有 restic 命令都以 executable 开头执行，默认是配置目录下的 restic。
    executable: __MCDR2RESTIC_EXECUTABLE__
    # restic 进程工作目录，留空表示继承 MCDR 当前目录。
    working_directory: ""
    # restic 存储库，默认是 MCDR 工作目录下的本地仓库。
    repository: __MCDR2RESTIC_REPOSITORY__
    # 存储库密码，留空时使用 password_file。示例密码仅用于上手测试，正式使用请改强密码。
    password: "123456"
    # 密码文件，仅在 password 为空时使用。
    password_file: ""
    # 找不到 restic 时自动下载，仅支持 Linux/Windows amd64。
    auto_download: true
    # 下载版本：默认使用插件内置信任的版本；latest 表示跟随官方最新版。
    download_version: "v0.19.1"
    # 下载代理前缀，先官方 GitHub，再按顺序尝试。
    download_proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    download_timeout_seconds: 120
    # 本地仓库缺失时自动执行 restic init；远端仓库不初始化。
    auto_init_local_repository: true
    # 执行 restic 时叠加的环境变量，值为 null 表示删除继承的同名变量。
    # repository/password/password_file 会自动写入对应 RESTIC_* 变量。
    environment: {}
    # 仓库维护命令，由 maintenance_schedule 调度执行，自动加 executable。
    maintenance_commands:
      - [
          "forget",
          "--keep-within", "1d",
          "--keep-daily", "7",
          "--prune"
        ]
    # 备份命令，自动加 executable。默认只备份世界，建议改为整个 ./server 目录或 MCDR 根目录，保护存档之外的文件。
  __MCDR2RESTIC_DEFAULT_BACKUP_COMMENT__
    backup_command:
      - "backup"
      __MCDR2RESTIC_DEFAULT_BACKUP_SOURCES__
      - "--tag"
      - "minecraft"
      - "--host"
      - "mcdr2Restic"
    # restic 命令流程总超时，0 表示不限制。
    timeout_seconds: 0
    # backup/restore --json 进度回显间隔（秒）。
    progress_interval_seconds: 5
    # 视为成功的退出码。
    success_exit_codes:
      - 0
    # 输出命中这些规则时按失败处理。
    error_regexes:
      - '(?i)^fatal:'
      - '(?i)^error(?:s)?\b(?!:\s*0\b)'
      - '(?i)\b(permission denied|input/output error|read error|unreadable|failed to|unable to)\b'
      - '(?i)\bno such file or directory\b'
    ignore_error_regexes:
      - '(?i)errors?:\s*0\b'
      - '(?i)no errors? (?:were )?found'
    max_output_chars_in_notification: 1800
  
  onebot:
    # OneBot v11 通知。填好 admin_qqs 后把 enabled 改为 true。
    enabled: false
    # WebSocket 地址
    ws_url: "ws://127.0.0.1:8777"
    # 连接验证令牌
    access_token: ""
    # true 时令牌放在 Authorization 头，false 时放在 URL 参数（NapCat 常用）。
    use_header_auth: false
    # 需要通知的 QQ
    admin_qqs:
      - 123456789
    # 消息前缀
    message_prefix: "[MCDR2Restic]"
    # 连接与发送超时、重连间隔（秒）
    connect_timeout_seconds: 10
    send_timeout_seconds: 10
    reconnect_interval_seconds: 5
  
  discord:
    # Discord Webhook 通知。填好 webhook_url 后把 enabled 改为 true。
    enabled: false
    # Discord 频道 Webhook URL
    webhook_url: ""
    # Webhook 显示名称和头像，可留空使用默认值。
    username: "MCDR2Restic"
    avatar_url: ""
    # 通知消息前缀
    message_prefix: "[MCDR2Restic]"
    # 可选提及对象，默认不提及任何人。
    mention_user_ids: []
    mention_role_ids: []
    mention_everyone: false
    send_timeout_seconds: 10
  
  custom_webhook:
    # 通用自定义 Webhook。填好 url 后把 enabled 改为 true。
    enabled: false
    # 接收 POST 请求的 URL。
    url: ""
    # 通知消息前缀。
    message_prefix: "[MCDR2Restic]"
    # 请求超时秒数。
    send_timeout_seconds: 10
    # 附加请求头，例如 Authorization。
    headers: {}
    # JSON 请求体模板，值中的 {message} 是通知正文，也可用 {label} {status} 等变量。
    payload:
      content: "{message}"
  
  notification:
    # 备份通知策略，对 OneBot、Discord 与自定义 Webhook 生效。
    notify_on_start: true # 备份开始时通知
    notify_on_success: true # 备份成功时通知
    notify_on_failure: true # 备份失败时通知
    notify_on_skip: false # 备份被跳过时通知
  
  snapshot_cache:
    # status 命令的快照列表缓存。
    enabled: true
    # 每页快照数量
    page_size: 10
    # 刷新缓存时 restic snapshots 的超时（秒）
    query_timeout_seconds: 30
    # 缓存数据库文件名，位于插件配置目录
    database: "snapshots.sqlite3"
  
  restore:
    # 恢复前自动创建的保护快照使用的 tag。
    pre_restore_backup_tag: "mcdr2restic-pre-restore"
    # 恢复流程中停止/启动 Minecraft 的超时（秒）。
    start_timeout_seconds: 120
  
  messages:
    # 管理员通知消息模板，可自行修改文本。
    # 可用变量：{prefix} {label} {start_time} {end_time} {duration_seconds} {status} {message} {detail} {error}
    # 如果需要输出字面量花括号，请写成 {{ 或 }}。
    backup_start: |-
      __MCDR2RESTIC_MESSAGE_backup_start__
    backup_success: |-
      __MCDR2RESTIC_MESSAGE_backup_success__
    backup_failure: |-
      __MCDR2RESTIC_MESSAGE_backup_failure__
    backup_skip_no_player: |-
      __MCDR2RESTIC_MESSAGE_backup_skip_no_player__
    backup_not_ready: |-
      __MCDR2RESTIC_MESSAGE_backup_not_ready__
    schedule_config_error: |-
      __MCDR2RESTIC_MESSAGE_schedule_config_error__
  
  __MCDR2RESTIC_CONFIG_VERSION_MARKER_COMMENT__
  config_version: 10

texts:
  "template.message.backup_failure": |-
    {prefix} 备份异常
    触发: {label}
    状态: {status}
    详情: {detail}
    结束时间: {end_time}
  "template.message.backup_not_ready": |-
    {prefix} 备份异常
    到达备份时间，但 Minecraft 服务端尚未确认正常运行，跳过本次备份
  "template.message.backup_skip_no_player": |-
    {prefix} 跳过备份
    本周期没有玩家加入或退出，触发检查时也没有玩家在线
  "template.message.backup_start": |-
    {prefix} 备份开始
    触发: {label}
    时间: {start_time}
  "template.message.backup_success": |-
    {prefix} 备份成功
    触发: {label}
    耗时: {duration_seconds} 秒
    结束时间: {end_time}
  "template.message.schedule_config_error": |-
    {prefix} 调度配置错误
    计算下次备份时间失败：{error}
  "template.snippet.config_version_marker_comment": |-
    # 配置文件版本标识。请保留在文件尾部，方便后续迁移。
  "template.snippet.default_backup_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # 新生成配置默认只写入 ./server/world；如果生成配置时检测到三世界目录全部存在，会自动加入 world_nether 和 world_the_end。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # 新生成配置默认只写入 .\server\world；如果生成配置时检测到三世界目录全部存在，会自动加入 world_nether 和 world_the_end。
  "template.snippet.minecraft_save_all_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # Linux Java 版示例。若服务端不支持 save-all flush，可改为 save-all。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # Windows Java 版示例。若服务端不支持 save-all flush，可改为 save-all。
  "template.snippet.restic_executable": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./config/mcdr2restic/restic"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\config\mcdr2restic\restic.exe'
  "template.snippet.restic_repository": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./restic-repo"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\restic-repo'
  "template.snippet.session_lock_exclude_comment": |-
    # Windows 下 Minecraft 会锁定 session.lock，默认排除以避免 restic 返回 3。
