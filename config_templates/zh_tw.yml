config_template: |-
  # MCDR2Restic 設定檔
  # state.yml為執行階段狀態文件，請勿更改
  
  # 总開關。
  enabled: true
  
  # 插件语言。預設会寫入生成配置時 MCDR 传入的语言。
  # 可填寫已有语言文件名，如 zh_cn、zh_tw、en_us；未匹配時回退 en_us。
  language: __MCDR2RESTIC_LANGUAGE__
  
  command:
    # MCDR 指令根節點
    root: "!!restic"
    #別名
    aliases:
      - "!!m2r"
    # MCDR 權限等級。
    permission_level: 3
  
  schedule:
    # interval_seconds > 0 時使用固定間隔。
    # interval_seconds = 0 時使用下面的 6 位 cron_expression。
    interval_seconds: 0
    # 6 位 cron：秒 分 時 日 月 周。預設每 3 小時檢查一次正常備份。
    cron_expression: "0 0 0,3,6,9,12,15,18,21 * * *"
    # 正常定時備份是否啟用玩家活動感知。
    # 觸發時会執行一次 list 檢查當前在線人數；join/left 事件会记錄本周期是否有人进入或退出。
    # 判断流程：
    # - 本周期有人加入：備份
    # - 无人加入，list 檢查在線人數為 0：略過
    # - 无人加入，list 檢查在線人數不為 0：備份
    # - 无人加入，但有人退出，即使 list 檢查為 0：備份
    require_player_activity_in_wait_period: true
    # 用于查询當前在線人數的 Minecraft 指令。預設 list。
    # 通過 server.rcon_query 執行；如果 RCON 不可用，將只依赖 join/left 事件估算。
    online_check_command: "list"
  
  force_schedule:
    # 强制備份調度，不遵循玩家活動感知。預設關閉。
    # interval_seconds > 0 時使用固定間隔。
    # interval_seconds = 0 且 cron_expression 不是 "0" 時使用 6 位 cron。
    # interval_seconds = 0 且 cron_expression = "0" 表示關閉强制備份。
    interval_seconds: 0
    cron_expression: "0"
  
  maintenance_schedule:
    # 倉庫維護調度。預設每天 03:00 執行一次；cron_expression 留空時仍使用預設值。
    # interval_seconds > 0 時使用固定間隔。
    # interval_seconds = 0 且 cron_expression = "0" 表示關閉維護調度。
    interval_seconds: 0
    cron_expression: "0 0 3 * * *"
  
  update_check:
    # 版本更新檢查。啟用后插件加載時檢查一次，并在每天 00:00 檢查一次。
    enabled: true
    check_on_startup: true
    daily_time: "00:00"
    # GitHub latest release API。網路不佳時会按 proxy_prefixes 尝試代理。
    api_url: "https://api.github.com/repos/pfdr2333/MCDR2restic/releases/latest"
    release_page_url: "https://github.com/pfdr2333/MCDR2restic/releases/latest"
    proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    timeout_seconds: 10
  
  minecraft:
  __MCDR2RESTIC_MINECRAFT_SAVE_ALL_COMMENT__
    save_off_command: "save-off"
    save_all_command: "save-all flush"
    save_on_command: "save-on"
    wait_after_save_off_seconds: 2
    wait_after_save_all_seconds: 10
    wait_after_save_on_seconds: 1
  
  restic:
    # 所有指令都以 executable 開頭執行。
    # 預設表示 MCDR 工作目錄下的 restic 可執行文件。
    executable: __MCDR2RESTIC_EXECUTABLE__
    # restic 进程工作目錄。
    # 留空字符串或 null 表示繼承 MCDR 當前工作目錄。
    working_directory: ""
    # restic 儲存庫。預設使用 MCDR 工作目錄下的本地倉庫。
    repository: __MCDR2RESTIC_REPOSITORY__
    # 儲存庫密碼。优先使用这里的直接密碼；留空字符串時再看 password_file。
    # 示例密碼方便開箱測試，正式使用請改成自己的强密碼。
    password: "123456"
    # 密碼文件。仅當 password 為空時生效。
    password_file: ""
    # 如果仍使用預設 executable 路徑且找不到 restic，则自動下載 restic。
    # 仅支持 Linux amd64 和 Windows amd64；其他系统会略過。
    auto_download: true
    # restic 下載版本。latest 表示 GitHub 最新 release，也可以寫 v0.18.0 这類版本号。
    download_version: "latest"
    # 下載加速代理前缀。会先尝試官方 GitHub 下載，再按順序尝試这里的代理。
    download_proxy_prefixes:
      - "https://gh.llkk.cc/"
      - "https://gh-proxy.com/"
      - "https://hub.gitmirror.com/"
    download_timeout_seconds: 120
    # 本地儲存庫不存在或缺少 config 時自動執行 restic init。
    # S3/B2/rest/sftp/rclone 等远端倉庫不会自動初始化。
    auto_init_local_repository: true
    # 執行 restic 時会繼承 MCDR 进程环境，并叠加这里的变量。
    # 值為 null 表示刪除繼承来的同名变量。
    # repository/password/password_file 会自動寫入 RESTIC_REPOSITORY/RESTIC_PASSWORD/RESTIC_PASSWORD_FILE。
    # S3/B2 等后端可以在这里加入对應云服務环境变量。
    environment: {}
    # 倉庫維護指令，由 maintenance_schedule 單独調度執行。每一项都会自動在前面加 executable，例如 restic forget ...
    maintenance_commands:
      - [
          "forget",
          "--keep-daily", "7",
          "--prune"
        ]
    # 備份指令。同样会自動在前面加 executable，例如 restic backup ...
  __MCDR2RESTIC_DEFAULT_BACKUP_COMMENT__
    backup_command:
      - "backup"
      __MCDR2RESTIC_DEFAULT_BACKUP_SOURCES__
      - "--tag"
      - "minecraft"
      - "--host"
      - "mcdr2Restic"
    # 整個 restic 指令流程共用的超時。0 表示不限制。
    timeout_seconds: 0
    # restic backup/restore --json 进度回顯間隔，單位秒。
    progress_interval_seconds: 5
    # restic 退出碼。0 成功；3 表示有源文件不可讀，本插件預設按失敗处理。
    success_exit_codes:
      - 0
    # 即使退出碼為 0，只要輸出匹配这些规则，也按異常处理。
    error_regexes:
      - '(?i)^fatal:'
      - '(?i)^error(?:s)?\b(?!:\s*0\b)'
      - '(?i)\b(permission denied|input/output error|read error|unreadable|failed to|unable to)\b'
      - '(?i)\bno such file or directory\b'
    ignore_error_regexes:
      - '(?i)errors?:\s*0\b'
      - '(?i)no errors? (?:were )?found'
    max_output_chars_in_notification: 1800
  
  onebot:
    # OneBot V11 正向 WebSocket。填好 admin_qqs 后把 enabled 改為 true。
    enabled: false
    # WebSocket 服務器地址
    ws_url: "ws://127.0.0.1:8777"
    # 用于連線验證的令牌
    access_token: ""
    # true 使用 Header: Authorization: Bearer xxx；false 使用 URL 参數 access_token，NapCat 常用。
    use_header_auth: false
    #需要通知的QQ
    admin_qqs:
      - 123456789
    #消息前缀
    message_prefix: "[MCDR2Restic]"
    # 網路超時與重連策略
    connect_timeout_seconds: 10
    send_timeout_seconds: 10
    reconnect_interval_seconds: 5
  
  discord:
    # Discord Webhook 通知。填好 webhook_url 后把 enabled 改為 true。
    enabled: false
    # Discord 頻道 Webhook URL。
    webhook_url: ""
    # Webhook 顯示名称和頭像，可留空使用 Discord Webhook 預設值。
    username: "MCDR2Restic"
    avatar_url: ""
    # Discord 通知訊息前缀，消息正文仍使用 messages 中的模板。
    message_prefix: "[MCDR2Restic]"
    # 可选提及对象。預設不提及任何人，避免誤 ping。
    mention_user_ids: []
    mention_role_ids: []
    mention_everyone: false
    send_timeout_seconds: 10
  
  notification:
    # 備份生命周期通知策略
    # 控制在哪些備份阶段向上述管理員推送 QQ 消息
    notify_on_start: true # 備份任務開始時是否發送通知
    notify_on_success: true # 備份任務成功完成時是否發送通知
    notify_on_failure: true # 備份任務失敗時是否發送通知
    notify_on_skip: false # 備份任務被略過（如无需備份）時是否發送通知
  
  snapshot_cache:
    # status 指令中的 restic 快照列表缓存。
    # 缓存寫入 SQLite 文件，只有倉庫被本插件操作后才会标记失效。
    enabled: true
    # 每頁顯示的快照數量。預設 10。
    page_size: 10
    # 缓存刷新時執行 restic snapshots --json 的超時時間。
    query_timeout_seconds: 30
    # SQLite 缓存文件名，位于本插件配置目錄。
    database: "snapshots.sqlite3"
  
  restore:
    # 執行還原前会自動備份一次，并给該保護快照追加这個 tag。
    pre_restore_backup_tag: "mcdr2restic-pre-restore"
    # 還原流程通過 MCDR 伺服器停止/啟動 hook 接力，这两個值保留给狀態机/外部看门狗使用。
    stop_timeout_seconds: 120
    start_timeout_seconds: 120
  
  messages:
    # 管理員通知訊息模板，可自行修改文本。
    # 可用变量：{prefix} {label} {start_time} {end_time} {duration_seconds} {status} {message} {detail} {error}
    # 如果需要輸出字面量花括号，請寫成 {{ 或 }}。
    backup_start: |-
      __MCDR2RESTIC_MESSAGE_backup_start__
    backup_success: |-
      __MCDR2RESTIC_MESSAGE_backup_success__
    backup_failure: |-
      __MCDR2RESTIC_MESSAGE_backup_failure__
    backup_skip_no_player: |-
      __MCDR2RESTIC_MESSAGE_backup_skip_no_player__
    backup_not_ready: |-
      __MCDR2RESTIC_MESSAGE_backup_not_ready__
    schedule_config_error: |-
      __MCDR2RESTIC_MESSAGE_schedule_config_error__
  
  __MCDR2RESTIC_CONFIG_VERSION_MARKER_COMMENT__
  config_version: 10

texts:
  "template.message.backup_failure": |-
    {prefix} 備份異常
    觸發: {label}
    狀態: {status}
    详情: {detail}
    结束時間: {end_time}
  "template.message.backup_not_ready": |-
    {prefix} 備份異常
    到达備份時間，但 Minecraft 伺服器尚未确認正常运行，略過本次備份
  "template.message.backup_skip_no_player": |-
    {prefix} 略過備份
    本周期没有玩家加入或退出，觸發檢查時也没有玩家在線
  "template.message.backup_start": |-
    {prefix} 備份開始
    觸發: {label}
    時間: {start_time}
  "template.message.backup_success": |-
    {prefix} 備份成功
    觸發: {label}
    耗時: {duration_seconds} 秒
    结束時間: {end_time}
  "template.message.schedule_config_error": |-
    {prefix} 調度配置錯誤
    计算下次備份時間失敗：{error}
  "template.snippet.config_version_marker_comment": |-
    # 設定檔版本标识。請保留在文件尾部，方便后續遷移。
  "template.snippet.default_backup_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # 新生成配置預設只寫入 ./server/world；如果生成配置時偵測到三世界目錄全部存在，会自動加入 world_nether 和 world_the_end。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # 新生成配置預設只寫入 .\server\world；如果生成配置時偵測到三世界目錄全部存在，会自動加入 world_nether 和 world_the_end。
  "template.snippet.minecraft_save_all_comment": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
      # Linux Java 版示例。若伺服器不支持 save-all flush，可改為 save-all。
    __MCDR2RESTIC_PLATFORM_WINDOWS__
      # Windows Java 版示例。若伺服器不支持 save-all flush，可改為 save-all。
  "template.snippet.restic_executable": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./restic"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\restic.exe'
  "template.snippet.restic_repository": |-
    __MCDR2RESTIC_PLATFORM_POSIX__
    "./restic-repo"
    __MCDR2RESTIC_PLATFORM_WINDOWS__
    '.\restic-repo'
  "template.snippet.session_lock_exclude_comment": |-
    # Windows 下 Minecraft 会鎖定 session.lock，預設排除以避免 restic 返回 3。
